# Bench validation: stay awake, use the wired IMU only, log through RTT.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_HID=n
CONFIG_USB_CDC_ACM=n
CONFIG_USE_IMU_WAKE_UP=n
CONFIG_USE_IMU_TIMEOUT=n
CONFIG_USE_ACTIVE_TIMEOUT=n
CONFIG_USER_SHUTDOWN=n
CONFIG_SENSOR_USE_MAG=n
CONFIG_USE_SENSOR_CLOCK=n
CONFIG_SENSOR_ACCEL_ODR=100
CONFIG_SENSOR_GYRO_ODR=100
# LSM6DSV maximum measurement ranges (16-bit raw output).
CONFIG_SENSOR_ACCEL_FS=16
CONFIG_SENSOR_GYRO_FS=4000
CONFIG_SENSOR_STARTUP_DELAY_MS=100
CONFIG_SENSOR_SCAN_RETRY_COUNT=20
CONFIG_SENSOR_SCAN_RETRY_DELAY_MS=250
CONFIG_SENSOR_ROTATION_0=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_SENSOR_DIAGNOSTICS=y
CONFIG_APP_THREAD_STACK_EXTRA_SIZE=1024
# The application owns ADC sampling; avoid a second driver on the same channel.
CONFIG_VOLTAGE_DIVIDER=n
CONFIG_ADC_LOG_LEVEL_ERR=y
CONFIG_SENSOR_LP_TIMEOUT=600000
# Let the current SDK hold the radio clock and apply nRF54L errata workarounds.
CONFIG_ESB_CLOCK_INIT=y
